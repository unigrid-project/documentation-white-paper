name: Release

on:
  push:
    tags:
      - '[0-9]*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Install TeX Live and Graphviz
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            texlive-latex-extra texlive-pictures texlive-science graphviz

      - name: Build PDF
        run: |
          sh .githooks/post-checkout
          for pass in 1 2 3; do
            pdflatex -shell-escape -interaction=nonstopmode -halt-on-error unigrid-whitepaper.tex
          done

      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >
          gh release create "$GITHUB_REF_NAME" unigrid-whitepaper.pdf
          --draft --title "Draft Version $GITHUB_REF_NAME" --generate-notes
